name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: academy/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies (academy)
        working-directory: academy
        run: npm ci

      - name: Type-check (academy)
        working-directory: academy
        run: npm run check

      - name: Build (academy)
        working-directory: academy
        run: npm run build

      - name: Assemble publish directory
        run: |
          mkdir -p _site
          # Root static site (index.html, app.js, styles.css, CNAME, etc.)
          # Copy top-level files only; exclude folders like academy/, .github/, .git/, _site/, node_modules/
          find . -maxdepth 1 -type f ! -name '.*' -exec cp {} _site/ \;
          # Preserve CNAME if present (dotfile excluded above only when starts with .)
          [ -f CNAME ] && cp CNAME _site/CNAME || true
          # Academy built client at /academy/
          mkdir -p _site/academy
          cp -r academy/dist/public/. _site/academy/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
